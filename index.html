<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webgpu-fly</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #06070a; color: #e6e6e6; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", monospace; }
      #app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
      #side { padding: 18px; overflow-y: auto; border-right: 1px solid #1a1c20; display: flex; flex-direction: column; gap: 14px; }
      #side h1 { font-size: 14px; margin: 0; letter-spacing: 0.04em; text-transform: uppercase; color: #9ad7ff; }
      #side h2 { font-size: 11px; margin: 0; letter-spacing: 0.06em; text-transform: uppercase; color: #6c7480; }

      #stim-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .stim-btn {
        flex: 1 0 calc(50% - 3px);
        padding: 8px 10px;
        background: #11161d;
        color: #c2c5ca;
        border: 1px solid #232a34;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        text-align: left;
        transition: background 0.1s, border-color 0.1s;
      }
      .stim-btn:hover { background: #1a2735; border-color: #2a3a4d; }
      .stim-btn.active { background: #1a3a55; border-color: #4a90c8; color: #9ad7ff; }
      .stim-btn:disabled { opacity: 0.5; cursor: wait; }
      .stim-btn .label { display: block; font-weight: 600; color: #e6e6e6; margin-bottom: 2px; }
      .stim-btn .hint { display: block; font-size: 10px; color: #6c7480; }

      #out { white-space: pre-wrap; font-size: 12px; color: #c2c5ca; flex: 1; min-height: 0; overflow-y: auto; }
      #out .ok { color: #6cd28a; }
      #out .warn { color: #f5c542; }
      #out .err { color: #ff6b6b; }

      #stage { position: relative; }
      #canvas-container { position: absolute; inset: 0; }
      #controls {
        position: absolute; left: 0; right: 0; bottom: 0;
        padding: 12px 18px;
        background: linear-gradient(180deg, transparent, rgba(6,7,10,0.85));
        display: flex; align-items: center; gap: 12px;
      }
      #controls input[type="range"] { flex: 1; }
      #controls button {
        background: #1a2735; color: #9ad7ff; border: 1px solid #2a3a4d;
        padding: 6px 14px; border-radius: 4px; cursor: pointer; font: inherit;
      }
      #controls button:hover { background: #25364a; }
      #frame-label { min-width: 140px; font-variant-numeric: tabular-nums; color: #9ad7ff; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="side">
        <h1>webgpu-fly</h1>
        <div>
          <h2 style="margin-bottom: 6px">Stimulus</h2>
          <div id="stim-row"></div>
        </div>
        <pre id="out"></pre>
      </aside>
      <main id="stage">
        <div id="canvas-container"></div>
        <div id="controls" hidden>
          <button id="play">▶</button>
          <input id="scrub" type="range" min="0" max="0" value="0" />
          <span id="frame-label">snap 0 / 0</span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
